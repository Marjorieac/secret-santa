<style>
  :root{
    --green:#0f3d2e; --green-2:#165a43; --red:#c8102e; --red-2:#a50d26;
    --cream:#fbf6ee; --gold:#d4a64a; --ink:#1d2421; --muted:#5f6b66; --line:#e7dfd2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:clip}
  body{
    font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);
    background:var(--green) radial-gradient(1200px 600px at 50% -10%,#1f6b51 0%,var(--green) 55%,#0a2b20 100%) fixed;
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  main{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));position:relative;z-index:1}
  .brand{text-align:center;color:var(--cream);margin:6px 0 18px}
  .brand .logo{width:clamp(64px,19vw,84px);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
  .brand h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(28px,7.5vw,38px);margin:6px 0 4px;letter-spacing:-.01em}
  .brand p{margin:0;opacity:.82;font-size:15px}
  .card{background:var(--cream);border-radius:20px;padding:clamp(16px,4.5vw,22px);margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .card h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.5}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
  input:focus,textarea:focus{border-color:var(--green-2);box-shadow:0 0 0 3px rgba(22,90,67,.15)}
  textarea{min-height:160px;resize:vertical;line-height:1.5}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--red);color:#fff;margin-top:14px;text-decoration:none;transition:transform .08s,background .2s}
  .btn:hover{background:var(--red-2)}
  .btn:active{transform:scale(.98)}
  .btn.secondary{background:var(--green)} .btn.secondary:hover{background:var(--green-2)}
  .btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--line)} .btn.ghost:hover{background:#fff}
  .btn.wa{background:#25D366;color:#063a1d} .btn.wa:hover{background:#1fbd5a}
  .btn[disabled]{background:#d8d1c5;color:#6f6a62;cursor:not-allowed;transform:none}
  .link{background:none;border:0;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0;color:inherit}
  .item{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:8px;padding:12px;border:1.5px dashed #dccfba;border-radius:14px;margin-top:10px;background:#fffdf9}
  .item .full,.item .num{grid-column:1/-1}
  .item .num{font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.06em}
  .rand{position:relative}
  .rand span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
  .rand input{padding-left:30px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;font-weight:600;padding:7px 11px;border-radius:999px;background:#fff;border:1.5px solid var(--line)}
  .chip.done{border-color:#bfe3cf;background:#eaf7f0;color:#14603f}
  .bar{height:10px;border-radius:99px;background:#e9e1d4;overflow:hidden;margin:4px 0 14px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:99px;transition:width .6s}
  .names{display:grid;gap:8px}
  .name-btn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;color:var(--ink);text-align:left}
  .name-btn:hover,.name-btn.active{border-color:var(--green-2)}
  .name-btn small{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap;margin-left:10px}
  .wish{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
  .wish li{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;color:var(--ink)}
  .wish b{display:block;font-weight:600;word-break:break-word}
  .wish .wtext{flex:1;min-width:0}
  .thumb{width:58px;height:58px;flex:none;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);background:#f1ece3;cursor:zoom-in}
  .thumb.noimg{display:none}
  .photo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .photo .ph-prev{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);background:#f1ece3}
  .ph-btn{display:inline-flex;align-items:center;gap:6px;margin:0;padding:10px 13px;border-radius:10px;border:1.5px dashed #cdbfa8;background:#fff;font-size:14px;font-weight:600;color:var(--green);cursor:pointer}
  .ph-rm{background:none;border:0;padding:6px 2px;font:inherit;font-size:13px;font-weight:600;color:var(--red);text-decoration:underline;cursor:pointer}
  .ph-note{font-size:13px;color:var(--muted)}
  .elf-pop{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:rgba(4,13,9,0);transition:background .3s}
  .elf-pop.on{background:rgba(4,13,9,.62)}
  .elf-card{position:relative;width:100%;max-width:400px;background:var(--cream);border-radius:22px;padding:58px 18px 16px;margin-top:160px;box-shadow:0 20px 50px rgba(0,0,0,.45);transform:translateY(130%);transition:transform .5s cubic-bezier(.2,1.35,.4,1)}
  .elf-pop.on .elf-card{transform:none}
  .elf-fig{position:absolute;left:50%;top:-150px;width:170px;margin-left:-85px;transform-origin:50% 95%;animation:elfwiggle 1.8s ease-in-out .55s infinite}
  .elf-fig img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25))}
  @keyframes elfwiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}30%{transform:rotate(6deg)}45%{transform:rotate(-3deg)}60%{transform:rotate(0)}}
  .bubble{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 14px 15px;text-align:center}
  .elf-title{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:19px;color:var(--red);margin-bottom:6px}
  .bubble p{margin:0;font-size:16px;line-height:1.45;color:var(--ink)}
  .elf-card .btn{margin-top:10px}
  .lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:80vh;border-radius:14px;background:#fff}
  .lightbox span{color:rgba(255,255,255,.7);font-size:13px}
  .wish a{font-size:13px;color:var(--green-2);font-weight:600}
  .price{font-weight:700;color:var(--red);white-space:nowrap}
  .hat-stage{text-align:center;padding:6px 0 2px}
  .hat{font-size:78px;line-height:1;display:inline-block;transform-origin:50% 90%}
  .hat.shake{animation:shake .32s infinite}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) translateY(-4px)}75%{transform:rotate(14deg) translateY(-4px)}}
  .reel{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:800;min-height:42px;margin:10px 0 6px;color:var(--green);word-break:break-word}
  .reel.landed{color:var(--red);animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  .card.result{background:linear-gradient(160deg,var(--red) 0%,#8f0b22 100%);color:#fff}
  .card.result .sub{color:rgba(255,255,255,.88)}
  .result .big{font-family:Fraunces,Georgia,serif;font-size:36px;font-weight:800;margin:2px 0 8px;word-break:break-word}
  .lock{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);padding:6px 11px;border-radius:99px}
  .banner{background:#fff4d6;border:1.5px solid #f0d58a;color:#6b5210;font-size:13px;border-radius:14px;padding:10px 12px;margin-bottom:14px;line-height:1.45}
  .err{color:var(--red);font-size:13px;font-weight:600;margin-top:10px;min-height:1em}
  .share{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px;word-break:break-all;color:var(--green-2);font-weight:600}
  .pin{letter-spacing:.55em;text-align:center;font-size:26px;font-weight:700;padding-left:.55em}
  .pin-box{margin-top:14px;padding-top:4px;border-top:1.5px dashed var(--line)}
  .foot{color:rgba(251,246,238,.75);text-align:center;font-size:13px;margin-top:18px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);opacity:0;background:#111;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;transition:.3s;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .flake{position:fixed;top:-20px;color:#fff;opacity:.55;pointer-events:none;z-index:0;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}
  .confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:30;pointer-events:none;animation:drop linear forwards}
  @keyframes drop{to{transform:translateY(110vh) rotate(720deg)}}
  /* ---- the big spin stage ---- */
  .stage{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;color:var(--cream);overflow:hidden;
    background:#040d09 radial-gradient(circle at 50% 42%,#4a4526 0,#0a1e16 48%,#040d09 100%);opacity:0;transition:opacity .4s}
  .stage.on{opacity:1}
  .stage > *{position:relative;z-index:1}
  .stage .msg{font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);min-height:20px;margin-bottom:14px;transition:opacity .25s}
  .stage .bighat{font-size:clamp(76px,15vh,112px);line-height:1;transform-origin:50% 90%;transition:filter .4s,transform .4s}
  .stage .bighat.shake{animation:shake .3s infinite}
  .stage .bighat.frenzy{animation:shake .11s infinite;filter:drop-shadow(0 0 26px rgba(212,166,74,.95))}
  .stage .bighat.gone{transform:scale(.5) translateY(-30px);opacity:.35;animation:none;transition:.5s}
  .rays{position:absolute !important;z-index:0 !important;width:640px;height:640px;left:50%;top:50%;margin:-320px 0 0 -320px;border-radius:50%;opacity:0;pointer-events:none;transition:opacity .8s;
    background:repeating-conic-gradient(rgba(212,166,74,.20) 0 9deg,transparent 9deg 18deg);animation:spinrays 16s linear infinite;
    -webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%)}
  .rays.on{opacity:1}
  @keyframes spinrays{to{transform:rotate(360deg)}}
  .window{width:min(calc(100vw - 32px),380px);height:76px;margin-top:22px;border-radius:18px;background:var(--cream);overflow:hidden;opacity:0;transform:scale(.7);transition:.45s cubic-bezier(.2,1.4,.4,1);
    box-shadow:0 0 0 4px var(--gold),0 0 50px rgba(212,166,74,.6)}
  .window.on{opacity:1;transform:none}
  .window::before,.window::after{content:"";position:absolute;left:0;right:0;height:24px;z-index:2;pointer-events:none}
  .window::before{top:0;background:linear-gradient(var(--cream),rgba(251,246,238,0))}
  .window::after{bottom:0;background:linear-gradient(rgba(251,246,238,0),var(--cream))}
  .window{position:relative}
  .window.locked{animation:thud .35s ease}
  @keyframes thud{40%{transform:scale(1.08)}100%{transform:scale(1)}}
  .strip{will-change:transform}
  .strip div{height:76px;display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(24px,7.5vw,31px);color:var(--green);padding:0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reveal{display:none;flex-direction:column;align-items:center;max-width:100%}
  .reveal.on{display:flex;animation:reveal .8s cubic-bezier(.2,1.5,.4,1)}
  @keyframes reveal{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  .reveal .you{font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold)}
  .reveal .who{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(38px,12vw,62px);line-height:1.05;margin:10px 0 6px;text-shadow:0 0 34px rgba(212,166,74,.65);word-break:break-word}
  .reveal .gift{width:clamp(84px,24vw,110px);height:auto;margin:6px 0 22px;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
  .reveal .btn{width:auto;padding:15px 28px}
  .flash{position:fixed;inset:0;background:#fff;z-index:46;pointer-events:none;animation:flash .8s ease forwards}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  .sound{position:absolute !important;top:calc(14px + env(safe-area-inset-top));right:14px;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:20px;width:44px;height:44px;border-radius:50%;cursor:pointer}
  .shot{position:fixed;width:10px;height:15px;border-radius:2px;z-index:50;pointer-events:none}
  @media (prefers-reduced-motion: reduce){ .flake,.confetti,.shot,.rays{display:none} .hat.shake,.reel.landed,.bighat,.reveal .gift,.elf-fig{animation:none !important} }
</style>

/* ---------- data layer: Firebase, or localStorage in demo mode ---------- */
function applyPatch(obj, patch){
  for (const [path, val] of Object.entries(patch)) {
    const keys = path.split("."); let o = obj;
    keys.slice(0, -1).forEach(k => { o[k] = o[k] || {}; o = o[k]; });
    o[keys[keys.length - 1]] = val;
  }
}

async function firebaseApi(){
  const V = "10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const db = fs.getFirestore(initializeApp(firebaseConfig));
  const ref = id => fs.doc(db, "groups", id);
  const iref = (g, i) => fs.doc(db, "groups", g, "images", i);
  return {
    // Photos live in their own small documents so the group stays well under Firestore's size limit.
    async putImage(g, i, src){ await fs.setDoc(iref(g, i), { src }); },
    async getImage(g, i){ const s = await fs.getDoc(iref(g, i)); return s.exists() ? s.data().src : ""; },
    async delImage(g, i){ try { await fs.deleteDoc(iref(g, i)); } catch {} },
    async create(group){ return (await fs.addDoc(fs.collection(db, "groups"), group)).id; },
    watch(id, cb, onErr){ return fs.onSnapshot(ref(id), s => cb(s.exists() ? s.data() : null), onErr); },
    // Atomic read-modify-write: two people can never land on the same name.
    mutate(id, fn){
      return fs.runTransaction(db, async tx => {
        const s = await tx.get(ref(id));
        if (!s.exists()) throw new Error("Group not found");
        const { result, patch } = fn(s.data());
        if (patch) tx.update(ref(id), patch);
        return result;
      });
    }
  };
}

function demoApi(){
  const KEY = "ss-demo-groups";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const save = d => store.set(KEY, JSON.stringify(d));
  const listeners = new Map();
  const emit = id => (listeners.get(id) || []).forEach(cb => cb(load()[id] || null));
  addEventListener("storage", e => { if (e.key === KEY) listeners.forEach((_, id) => emit(id)); });
  const ik = (g, i) => `ss-demo-img-${g}-${i}`;
  return {
    async putImage(g, i, src){
      try { localStorage.setItem(ik(g, i), src); }
      catch { throw new Error("This browser is out of space for demo photos. They'll work fine once Firebase is connected."); }
    },
    async getImage(g, i){ return store.get(ik(g, i)) || ""; },
    async delImage(g, i){ store.del(ik(g, i)); },
    async create(group){ const d = load(); const id = "demo" + Math.random().toString(36).slice(2, 9); d[id] = group; save(d); return id; },
    watch(id, cb){ listeners.set(id, [...(listeners.get(id) || []), cb]); cb(load()[id] || null); },
    async mutate(id, fn){
      const d = load(); const g = d[id];
      if (!g) throw new Error("Group not found");
      const { result, patch } = fn(structuredClone(g));
      if (patch) { applyPatch(g, patch); save(d); setTimeout(() => emit(id)); }
      return result;
    }
  };
}

// Shrinks a phone photo (often 3–5 MB) to a ~640px JPEG of roughly 50–150 KB before upload.
async function shrinkImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error("That file doesn't look like a photo. Try a JPG or PNG."));
      im.src = url;
    });
    const k = Math.min(1, 640 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    let q = .78, out = c.toDataURL("image/jpeg", q);
    while (out.length > 280000 && q > .35) { q -= .1; out = c.toDataURL("image/jpeg", q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}
// Any <img data-img="id"> on the page gets its photo loaded automatically (and cached).
const imgCache = new Map();
function hydrateImages(){
  document.querySelectorAll("img[data-img]:not([src])").forEach(el => {
    const id = el.dataset.img;
    if (!imgCache.has(id)) imgCache.set(id, api.getImage(gid, id).catch(() => ""));
    imgCache.get(id).then(src => { if (el.dataset.img !== id) return; if (src) el.src = src; else el.classList.add("noimg"); });
  });
}

async function hashPin(s){
  if (crypto.subtle) {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  }
  let n = 5381; for (const c of s) n = ((n << 5) + n + c.charCodeAt(0)) | 0;
  return "x" + (n >>> 0).toString(16);
}

/* ---------- the hat draw ----------
   Picks a random person who isn't you and hasn't been drawn yet.
   Safety rule: when only 2 people are left to spin, the first of them
   MUST take the other one if they're still available — otherwise the
   very last person could be left holding their own name.            */
function pickRecipient(ps, me){
  if (ps[me].drawn) return ps[me].drawn;
  const ids = Object.keys(ps);
  const taken = new Set(ids.map(i => ps[i].drawn).filter(Boolean));
  const givers = ids.filter(i => !ps[i].drawn);
  let options = ids.filter(i => i !== me && !taken.has(i));
  if (givers.length === 2) {
    const other = givers.find(i => i !== me);
    if (!taken.has(other)) options = [other];
  }
  if (!options.length) throw new Error("No names left in the hat — ask the organiser to reset the draw.");
  return options[rand(options.length)];
}

function viewCreate(){

  $app.innerHTML = brand("Family Secret Santa", "Wishlists · one spin · zero peeking") + demoBanner() + `
  <section class="card">
    <h2>Start a draw</h2>
    <p class="sub">Add everyone taking part (yourself too). You'll get a link to drop in the family WhatsApp group.</p>
    <form id="createForm">
      <label for="gname">Group name</label>
      <input id="gname" maxlength="60" value="Family Secret Santa ${new Date().getFullYear()}">
      <label for="names">Names — one per line</label>
      <textarea id="names" placeholder="Mom&#10;Dad&#10;Thabo&#10;Lerato"></textarea>
      <div class="err" id="createErr"></div>
      <button class="btn" type="submit" id="createBtn">Create &amp; get the link 🎁</button>
    </form>
  </section>`;
  $("#createForm").onsubmit = async e => {
    e.preventDefault();
    const err = $("#createErr"); err.textContent = "";
    const name = $("#gname").value.trim() || "Family Secret Santa";
    const raw = $("#names").value.split("\n").map(s => s.trim()).filter(Boolean);
    const seen = new Set(), names = [];
    for (const n of raw) {
      const k = n.toLowerCase();
      if (seen.has(k)) { err.textContent = `“${n}” appears twice — every name must be unique.`; return; }
      seen.add(k); names.push(n.slice(0, 40));
    }
    if (names.length < 3) { err.textContent = "You need at least 3 people to keep it a secret."; return; }
    if (names.length > 40) { err.textContent = "Max 40 people per draw."; return; }
    const participants = {};
    names.forEach((n, i) => participants["p" + i] = { name: n, pin: "", wishlist: [], ready: false, drawn: "" });
    const btn = $("#createBtn"); btn.disabled = true; btn.textContent = "Wrapping it up…";
    try {
      const id = await api.create({ name, budget: BUDGET_MAX, budgetMin: BUDGET_MIN, createdAt: Date.now(), participants });
      viewShare(id, name);
    } catch (e2) {
      err.textContent = "Couldn't create the group: " + e2.message;
      btn.disabled = false; btn.textContent = "Create & get the link 🎁";
    }
  };
}

function showPin(id){
  const p = group.participants[id], isNew = !p.pin;
  const box = $("#pinBox");
  box.innerHTML = `
  <form id="pinForm" class="pin-box">
    <label for="pin">${isNew ? `Hi ${esc(p.name)}! Choose a 4-digit PIN` : `Welcome back, ${esc(p.name)}. Enter your PIN`}</label>
    <input class="pin" id="pin" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="4-digit PIN">
    <p class="sub" style="margin:8px 0 0">${isNew ? "Remember it — you'll need it if you open the link on another phone." : "Forgot it? The organiser can clear it for you."}</p>
    <div class="err" id="pinErr"></div>
    <button class="btn secondary" type="submit">Continue</button>
  </form>`;
  const input = $("#pin"); input.focus({ preventScroll: true });
  box.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "nearest" });
  $("#pinForm").onsubmit = async e => {
    e.preventDefault();
    const pin = input.value.trim(), err = $("#pinErr");
    if (!/^\d{4}$/.test(pin)) { err.textContent = "Your PIN must be exactly 4 digits."; return; }
    const hash = await hashPin(`${gid}:${id}:${pin}`);
    try {
      const res = await api.mutate(gid, g => {
        const q = g.participants[id];
        if (!q) return { result: "missing" };
        if (!q.pin) return { result: "ok", patch: { [`participants.${id}.pin`]: hash } };
        return { result: q.pin === hash ? "ok" : "bad" };
      });
      if (res !== "ok") { err.textContent = isNew ? "Someone just joined as this name. Is that you on another phone?" : "That PIN doesn't match. Try again 🎄"; return; }
      group.participants[id].pin = hash;
      me = id; store.set(KEY_ME(), id);
      viewMe();
    } catch (e2) { err.textContent = "Couldn't connect: " + e2.message; }
  };
}

  const drawFirst = p.ready;
  $app.innerHTML = brand(group.name, `Hi ${p.name} 👋`) + demoBanner() +
    (drawFirst ? `<div id="drawSec"></div><section class="card" id="listSec"></section>`
               : `<section class="card" id="listSec"></section><div id="drawSec"></div>`) + `
    <section class="card" id="progSec"></section>
    <p class="foot">Not ${esc(p.name)}? <button class="link" id="switchBtn">Switch person</button></p>`;
  $("#switchBtn").onclick = () => { store.del(KEY_ME()); store.del(KEY_DRAWN()); me = null; viewWho(); };
  renderList(); renderDraw(); renderProgress();
}

function updateMe(){
  if (!group.participants[me]) return route();
  if (!editing) renderList();
  if (!spinning) renderDraw();
  renderProgress();
}

function wishHtml(list){
  return `<ul class="wish">${(list || []).map(w => {
    const u = safeUrl(w.link);
    return `<li>${w.img ? `<img class="thumb" data-img="${esc(w.img)}" alt="Photo of ${esc(w.item)}">` : ""}<div class="wtext"><b>${esc(w.item)}</b>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">View link ↗</a>` : ""}</div><span class="price">${rands(w.price)}</span></li>`;
  }).join("")}</ul>`;
}

function renderList(){
  const sec = $("#listSec"), p = group.participants[me];
  if (!editing && p.ready) {
    sec.innerHTML = `<h2>Your wishlist</h2><p class="sub">Your Secret Santa sees this. You can still tweak it.</p>${wishHtml(p.wishlist)}
      <button class="btn ghost" id="editBtn">Edit my wishlist</button>`;
    $("#editBtn").onclick = () => { editing = true; renderList(); };
    return;
  }
  const w = p.wishlist || [];
  const eg = ["Scented candle", "Paperback novel", "Braai tongs", "Board game", "Cosy socks"];
  sec.innerHTML = `<h2>${p.ready ? "Edit your wishlist" : "Your wishlist"}</h2>
  <p class="sub">Add ${ITEMS} gift ideas, ideally between <b>R${BUDGET_MIN} and R${BUDGET_MAX}</b> (R${BUDGET_MAX} max). A photo or link helps your Santa find the exact thing.</p>
  <form id="wishForm" novalidate>
    ${Array.from({ length: ITEMS }, (_, i) => `
    <div class="item">
      <div class="num">Gift ${i + 1}</div>
      <input name="item${i}" placeholder="e.g. ${eg[i % eg.length]}" maxlength="80" value="${esc(w[i]?.item)}" aria-label="Gift ${i + 1} name">
      <div class="rand"><span>R</span><input name="price${i}" type="number" inputmode="decimal" min="1" max="${BUDGET_MAX}" step="0.01" placeholder="Price" value="${w[i]?.price ?? ""}" aria-label="Gift ${i + 1} price"></div>
      <input class="full" name="link${i}" type="url" inputmode="url" placeholder="Link (optional)" maxlength="300" value="${esc(w[i]?.link)}" aria-label="Gift ${i + 1} link">
      <div class="photo full" data-i="${i}">
        <img class="ph-prev" alt="" hidden>
        <label class="ph-btn">📷 <span>Add photo</span><input type="file" accept="image/*" hidden></label>
        <button type="button" class="ph-rm" hidden>Remove</button>
        <span class="ph-note"></span>
      </div>
    </div>`).join("")}
    <div class="err" id="wishErr"></div>
    <button class="btn secondary" type="submit" id="saveBtn">${p.ready ? "Save changes" : "Save my wishlist ✅"}</button>
    ${p.ready ? `<button class="btn ghost" type="button" id="cancelEdit">Cancel</button>` : ""}
  </form>`;
  if (p.ready) $("#cancelEdit").onclick = () => { editing = false; renderList(); };

  // photo state per gift: keep = existing photo id, fresh = newly picked (already shrunk) photo
  const photos = Array.from({ length: ITEMS }, (_, i) => ({ keep: w[i]?.img || "", fresh: "" }));
  const paint = i => {
    const box = sec.querySelector(`.photo[data-i="${i}"]`), im = box.querySelector(".ph-prev"), ph = photos[i];
    if (ph.fresh) { im.removeAttribute("data-img"); im.src = ph.fresh; im.hidden = false; }
    else if (ph.keep) { im.removeAttribute("src"); im.dataset.img = ph.keep; im.hidden = false; hydrateImages(); }
    else { im.removeAttribute("src"); im.removeAttribute("data-img"); im.hidden = true; }
    box.querySelector(".ph-btn span").textContent = (ph.fresh || ph.keep) ? "Change photo" : "Add photo";
    box.querySelector(".ph-rm").hidden = !(ph.fresh || ph.keep);
  };
  for (let i = 0; i < ITEMS; i++) {
    const box = sec.querySelector(`.photo[data-i="${i}"]`);
    paint(i);
    box.querySelector("input[type=file]").onchange = async ev => {
      const file = ev.target.files[0]; ev.target.value = "";
      if (!file) return;
      const note = box.querySelector(".ph-note"); note.textContent = "Preparing…";
      try { photos[i].fresh = await shrinkImage(file); note.textContent = ""; paint(i); }
      catch (e3) { note.textContent = ""; toast(e3.message); }
    };
    box.querySelector(".ph-rm").onclick = () => { photos[i] = { keep: "", fresh: "" }; paint(i); };
  }

  // The Budget Elf: pops up when someone leaves a price field (and again on save if needed)
  const ack = [];   // low prices the person already said "keep it" to
  async function priceOk(i, v){
    const input = sec.querySelector(`[name=price${i}]`);
    if (v > BUDGET_MAX) { await elfPopup("high", v); input.focus(); input.select(); return false; }
    if (v < ELF_WARN_BELOW && ack[i] !== v) {
      if (await elfPopup("low", v)) { ack[i] = v; return true; }
      input.focus(); input.select(); return false;
    }
    return true;
  }
  for (let i = 0; i < ITEMS; i++) {
    const input = sec.querySelector(`[name=price${i}]`);
    input.addEventListener("change", () => { const v = parseFloat(input.value); if (v > 0) priceOk(i, v); });
  }

  $("#wishForm").onsubmit = async e => {
    e.preventDefault();
    if (document.querySelector(".elf-pop")) return;   // the elf is already talking
    const f = e.target, err = $("#wishErr"); err.textContent = "";
    const items = [];
    for (let i = 0; i < ITEMS; i++) {
      const item = f[`item${i}`].value.trim();
      const price = parseFloat(f[`price${i}`].value);
      let link = f[`link${i}`].value.trim();
      if (!item) { err.textContent = `Gift ${i + 1} needs a name.`; return; }
      if (!(price > 0)) { err.textContent = `Add a price for gift ${i + 1}.`; return; }
      if (!(await priceOk(i, price))) return;
      if (link) {
        if (!/^https?:\/\//i.test(link)) link = "https://" + link;
        link = safeUrl(link);
        if (!link) { err.textContent = `The link for gift ${i + 1} doesn't look right.`; return; }
      }
      items.push({ item, price: Math.round(price * 100) / 100, link });
    }
    const btn = $("#saveBtn"); btn.disabled = true;
    try {
      // upload any new photos first, each in its own document
      if (photos.some(ph => ph.fresh)) btn.textContent = "Uploading photos…";
      for (let i = 0; i < ITEMS; i++) {
        const ph = photos[i];
        if (ph.fresh) {
          const id = `${me}-${i}-${Date.now().toString(36)}`;
          await api.putImage(gid, id, ph.fresh);
          imgCache.set(id, Promise.resolve(ph.fresh));
          ph.keep = id; ph.fresh = "";
        }
        items[i].img = ph.keep;
      }
      btn.textContent = "Saving…";
      await api.mutate(gid, () => ({ result: true, patch: { [`participants.${me}.wishlist`]: items, [`participants.${me}.ready`]: true } }));
      // tidy up photos that were replaced or removed
      (w || []).forEach(old => { if (old?.img && !items.some(it => it.img === old.img)) api.delImage(gid, old.img); });
      group.participants[me].wishlist = items; group.participants[me].ready = true;
      toast("Wishlist saved 🎄");
      viewMe();
    } catch (e2) { err.textContent = "Couldn't save: " + e2.message; btn.disabled = false; btn.textContent = "Try again"; }
  };
}

function renderDraw(){
  const sec = $("#drawSec"), ps = group.participants, mine = ps[me];
  if (mine.drawn && ps[mine.drawn]) { store.set(KEY_DRAWN(), mine.drawn); sec.innerHTML = resultCard(mine.drawn); return; }
  const waiting = Object.keys(ps).filter(i => !ps[i].ready);
  const open = waiting.length === 0;
  sec.innerHTML = `<section class="card">
    <div class="hat-stage"><div class="hat" id="hat">🎩</div><div class="reel" id="reel">${open ? "Your turn!" : "The hat is closed"}</div></div>
    <p class="sub" style="text-align:center">${open
      ? "Every wishlist is in. One spin, and it's final — no re-spins!"
      : `Waiting for ${waiting.length} more wishlist${waiting.length > 1 ? "s" : ""}${waiting.includes(me) ? " (including yours!)" : ""}.`}</p>
    <button class="btn" id="spinBtn" ${open ? "" : "disabled"}>${open ? "Spin the hat 🎩" : "🔒 Unlocks when everyone's ready"}</button>
  </section>`;
  if (open) $("#spinBtn").onclick = spin;
}

function resultCard(t){
  const r = group.participants[t];
  return `<section class="card result">
    <span class="lock">🔒 Locked in — this is your person</span>
    <p class="sub" style="margin:14px 0 0">You're the Secret Santa for</p>
    <div class="big">${esc(r.name)} 🎁</div>
    <p class="sub">Choose from their wishlist below. And keep it zipped 🤐</p>
    ${wishHtml(r.wishlist)}
  </section>`;
}

/* ---------- sound effects (generated live, no audio files) ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
const sfx = (() => {
  let ctx = null, out = null, on = store.get("ss-sound") !== "off", rollT = null, noiseBuf = null;
  const init = () => {
    if (!on) return;
    try {
      // iPhone: let the app's sound play even when the ring/silent switch is on silent
      if (navigator.audioSession) navigator.audioSession.type = "playback";
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        // master chain: a compressor keeps it loud on small phone speakers without crackling
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.knee.value = 8; comp.ratio.value = 6; comp.attack.value = .003; comp.release.value = .15;
        out = ctx.createGain(); out.gain.value = 1.6;
        out.connect(comp).connect(ctx.destination);
      }
      if (ctx.state !== "running") ctx.resume();
      // tiny silent blip, played inside the tap, fully "unlocks" audio on iOS
      const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0);
    } catch { ctx = null; }
  };
  const noise = () => {
    if (noiseBuf) return noiseBuf;
    noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.25), ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  };
  const snare = (vol = .5, len = .09) => {
    if (!on || !ctx) return;
    const t = ctx.currentTime, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise(); f.type = "highpass"; f.frequency.value = 1200;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
    s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + len + .02);
  };
  const tone = (freq, at, dur, vol, type = "triangle") => {
    if (!on || !ctx) return;
    const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + .05);
  };
  return {
    init,
    get on(){ return on; },
    toggle(){ on = !on; store.set("ss-sound", on ? "on" : "off"); if (on) init(); else this.stopRoll(); return on; },
    startRoll(){ // a drumroll that speeds up and gets louder
      this.stopRoll(); let gap = 100, vol = .35;
      const hit = () => { snare(vol); gap = Math.max(40, gap * .96); vol = Math.min(.8, vol * 1.04); rollT = setTimeout(hit, gap); };
      hit();
    },
    stopRoll(){ clearTimeout(rollT); rollT = null; },
    tick(){ tone(1900, 0, .05, .35, "square"); },
    boing(){ // a cartoon "boing" for the elf's entrance
      if (!on || !ctx) return;
      const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(950, t + .16); o.frequency.exponentialRampToValueAtTime(420, t + .36);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.55, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .42);
      o.connect(g).connect(out); o.start(t); o.stop(t + .46);
    },
    thud(){ snare(.9, .14); tone(392, 0, .25, .5, "triangle"); },   // a bright "clack" phone speakers can play
    tada(){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, .06 + i * .09, 1.5, .45)); tone(1568, .45, 1.2, .25); }
  };
})();

/* ---------- the big spin ---------- */
function openStage(){
  const el = document.createElement("div");
  el.className = "stage";
  el.innerHTML = `
    <div class="rays"></div>
    <button class="sound" aria-label="Toggle sound">${sfx.on ? "🔊" : "🔇"}</button>
    <div class="msg"></div>
    <div class="bighat">🎩</div>
    <div class="window"><div class="strip"></div></div>
    <div class="reveal"><div class="you">You're Secret Santa for</div><div class="who"></div><img class="gift" src="${SANTA}" alt="">
      <button class="btn">See their wishlist</button></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("on"));
  el.querySelector(".sound").onclick = e => { e.currentTarget.textContent = sfx.toggle() ? "🔊" : "🔇"; };
  const q = s => el.querySelector(s);
  return {
    el, hat: q(".bighat"), rays: q(".rays"), win: q(".window"), strip: q(".strip"), reveal: q(".reveal"),
    msg(t){ const m = q(".msg"); m.style.opacity = 0; setTimeout(() => { m.textContent = t; m.style.opacity = 1; }, 180); },
    close(){ el.classList.remove("on"); setTimeout(() => el.remove(), 400); }
  };
}

// Slot-machine reel: races through names, crawls to a stop on a decoy,
// hangs there… then clicks over one more to the real name.
function runReel(st, target){
  return new Promise(res => {
    const ps = group.participants, H = 76;
    const pool = Object.keys(ps).filter(i => i !== me).map(i => ps[i].name);
    const real = ps[target].name, decoys = pool.filter(n => n !== real);
    const decoy = decoys[rand(decoys.length)];
    const seq = []; let last = "";
    while (seq.length < 22) { const n = pool[rand(pool.length)]; if (n !== last) { seq.push(n); last = n; } }
    while (seq[seq.length - 1] === decoy) seq.pop();
    seq.push(decoy, real, decoys[0] === real ? decoy : decoys[0]);
    st.strip.innerHTML = seq.map(n => `<div>${esc(n)}</div>`).join("");
    const decoyIdx = seq.length - 3, realIdx = seq.length - 2;
    let lastIdx = 0;
    const move = (from, to, dur, ease) => new Promise(done => {
      const t0 = performance.now();
      const frame = now => {
        const k = Math.min(1, (now - t0) / dur), pos = from + (to - from) * ease(k);
        st.strip.style.transform = `translateY(${-pos * H}px)`;
        const idx = Math.round(pos);
        if (idx !== lastIdx) { lastIdx = idx; sfx.tick(); if (dur > 1000 && k > .6) buzz(6); }
        k < 1 ? requestAnimationFrame(frame) : done();
      };
      requestAnimationFrame(frame);
    });
    const easeOut = k => 1 - Math.pow(1 - k, 4);
    const easeBack = k => { const c = 2.2; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
    (async () => {
      st.win.classList.add("on");
      await move(0, decoyIdx, 2600, easeOut);           // spin down
      await sleep(350);                                  // a tiny hang
      await move(decoyIdx, realIdx, 380, easeBack);      // click onto the real name
      sfx.thud(); buzz(30); st.win.classList.add("locked");
      await sleep(500);
      res();
    })();
  });
}

function cannons(){
  if (reduced) return;
  const colors = ["#c8102e", "#d4a64a", "#ffffff", "#1f8a5b", "#f2c94c"];
  const W = innerWidth, Hh = innerHeight;
  for (let side = 0; side < 2; side++) for (let i = 0; i < 24; i++) {
    const c = document.createElement("div"); c.className = "shot";
    c.style.background = colors[i % colors.length];
    c.style.left = side ? (W - 10) + "px" : "0px"; c.style.top = Hh + "px";
    document.body.appendChild(c);
    const dx = (side ? -1 : 1) * (W * (.25 + Math.random() * .7)), up = Hh * (.55 + Math.random() * .4);
    c.animate([
      { transform: "translate(0,0) rotate(0)" },
      { transform: `translate(${dx * .7}px,${-up}px) rotate(${360 + Math.random() * 360}deg)`, offset: .4 },
      { transform: `translate(${dx}px,${-up + Hh * .7}px) rotate(900deg)`, opacity: 0 }
    ], { duration: 2400 + Math.random() * 1400, easing: "cubic-bezier(.15,.7,.4,1)", delay: Math.random() * 250 }).onfinish = () => c.remove();
  }
}

async function spin(){
  if (spinning) return;
  spinning = true;
  sfx.init();                                   // must happen inside the tap
  const st = openStage();
  st.msg("Reaching into the hat…");
  st.hat.classList.add("shake");
  sfx.startRoll();
  const minWait = sleep(reduced ? 0 : 1000);
  let target;
  try {
    target = await api.mutate(gid, g => {
      const ps = g.participants;
      if (Object.values(ps).some(p => !p.ready)) throw new Error("Not everyone's wishlist is in yet.");
      if (ps[me].drawn) return { result: ps[me].drawn };
      const t = pickRecipient(ps, me);
      return { result: t, patch: { [`participants.${me}.drawn`]: t, [`participants.${me}.drawnAt`]: Date.now() } };
    });
    await minWait;
  } catch (e) { sfx.stopRoll(); st.close(); spinning = false; toast(e.message); renderDraw(); return; }
  store.set(KEY_DRAWN(), target);

  if (!reduced) {
    st.rays.classList.add("on");
    sfx.stopRoll();
    st.hat.classList.remove("frenzy"); st.hat.classList.add("gone");
    st.msg("Pulling out a name…");
    await runReel(st, target);
  } else sfx.stopRoll();

  // The reveal
  sfx.tada(); buzz([60, 40, 100]);
  st.msg(""); st.hat.style.display = "none"; st.win.style.display = "none";
  st.reveal.querySelector(".who").textContent = group.participants[target].name;
  st.reveal.classList.add("on");
  cannons(); confetti();
  renderDraw(); renderProgress();               // the result card waits underneath
  st.reveal.querySelector(".btn").onclick = () => { scrollTo({ top: 0 }); st.close(); spinning = false; };
}

function renderProgress(){
  const ps = group.participants, ids = sortedIds();
  const done = ids.filter(i => ps[i].ready).length, spun = ids.filter(i => ps[i].drawn).length;
  const all = done === ids.length;
  const missing = ids.filter(i => !ps[i].ready).map(i => ps[i].name);
  const nudge = `🎅 Secret Santa reminder! Still waiting for wishlists from: ${missing.join(", ")}. The hat can't open until everyone's in 😄\n\n${baseUrl()}?g=${gid}`;
  $("#progSec").innerHTML = `<h2>The family</h2>
    <p class="sub">${all ? `All ${ids.length} wishlists are in! ${spun} of ${ids.length} have spun.` : `${done} of ${ids.length} wishlists done.`}</p>
    <div class="bar"><i style="width:${((all ? spun : done) / ids.length) * 100}%"></i></div>
    <div class="chips">${ids.map(i => {
      const p = ps[i], ok = all ? !!p.drawn : p.ready;
      return `<span class="chip ${ok ? "done" : ""}">${all ? (p.drawn ? "🎁" : "⏳") : (p.ready ? "✓" : "⏳")} ${esc(p.name)}${i === me ? " (you)" : ""}</span>`;
    }).join("")}</div>
    ${all ? "" : `<a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(nudge)}" target="_blank" rel="noopener">Nudge the stragglers on WhatsApp</a>`}`;
}

/* ---------- festive extras ---------- */
function snow(){
  if (reduced) return;
  for (let i = 0; i < 18; i++) {
    const f = document.createElement("div");
    f.className = "flake"; f.textContent = "❄";
    f.style.left = Math.random() * 100 + "vw";
    f.style.fontSize = 8 + Math.random() * 12 + "px";
    f.style.animationDuration = 9 + Math.random() * 12 + "s";
    f.style.animationDelay = -Math.random() * 20 + "s";
    document.body.appendChild(f);
  }
}
function confetti(){
  if (reduced) return;
  const colors = ["#c8102e", "#d4a64a", "#ffffff", "#1f8a5b", "#f2c94c"];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2 + Math.random() * 2.5 + "s";
    c.style.animationDelay = Math.random() * 0.4 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5200);
  }
}

/* ---------- boot ---------- */
function showFatal(msg){
  $app.innerHTML = brand("Family Secret Santa") + `<section class="card"><h2>Something's tangled 🎄</h2><p class="sub">${esc(msg)}</p></section>`;
}

async function boot(){
  snow();
  new MutationObserver(() => api && hydrateImages()).observe(document.body, { childList: true, subtree: true });
  try { api = DEMO ? demoApi() : await firebaseApi(); }
  catch (e) { return showFatal("Couldn't load Firebase. Check your internet connection and the config in index.html."); }
  if (!gid) return viewCreate();
  $app.innerHTML = brand("Family Secret Santa") + `<section class="card"><p class="sub" style="margin:0">Unwrapping your draw… 🎁</p></section>`;
  me = store.get(KEY_ME());
  let first = true;
  api.watch(gid, g => {
    group = g;
    if (!g) return viewMissing();
    if (first) { first = false; return route(); }
    if (view === "me") updateMe();
  }, e => showFatal("Couldn't reach the database (" + e.code + "). Check the Firestore rules and the config in index.html."));
}
boot();
